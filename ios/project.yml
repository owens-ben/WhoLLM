# XcodeGen spec. The .xcodeproj is generated from this file and not committed.
# Run `make generate` (or `xcodegen generate`) after changing it.
name: Roomer
options:
  bundleIdPrefix: com.bsowens
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Roomer:
    type: application
    platform: iOS
    sources: [Roomer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bsowens.roomer
        PRODUCT_NAME: Roomer
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Roomer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RoomerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RoomerTests]
    dependencies:
      - target: Roomer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bsowens.roomer.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Roomer:
    build:
      targets:
        Roomer: all
        RoomerTests: [test]
    test:
      targets: [RoomerTests]
