services:
  whollm-dashboard:
    image: nginx:alpine
    container_name: whollm-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3380}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # host:port of your Home Assistant, as seen from the Docker host
      - HA_HOST=${HA_HOST:-homeassistant.local:8123}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment and customize labels for your dashboard (Homepage, Traefik, etc.)
    # labels:
    #   - "homepage.group=AI"
    #   - "homepage.name=WhoLLM Dashboard"
    #   - "homepage.icon=brain"
    #   - "homepage.href=http://YOUR_HOST:3380"
    #   - "homepage.description=LLM-powered room presence visualization"

# Uncomment if using Traefik or other network
# networks:
#   traefik:
#     external: true



