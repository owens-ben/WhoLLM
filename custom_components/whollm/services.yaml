refresh:
  name: Refresh Presence
  description: Force an immediate presence detection update
  fields:
    entity_id:
      name: Entity ID
      description: Optional entity to refresh (refreshes all if not specified)
      required: false
      example: sensor.alice_room
      selector:
        entity:
          domain: sensor
          integration: whollm

correct_room:
  name: Correct Room
  description: Manually correct a person's room location (helps the system learn)
  fields:
    entity_id:
      name: Entity ID
      description: The room sensor to correct
      required: true
      example: sensor.alice_room
      selector:
        entity:
          domain: sensor
          integration: whollm
    room:
      name: Room
      description: The correct room name
      required: true
      example: office
      selector:
        text:
    confidence:
      name: Confidence
      description: Confidence level (0.0 to 1.0)
      required: false
      default: 1.0
      example: 1.0
      selector:
        number:
          min: 0
          max: 1
          step: 0.1

get_history:
  name: Get History
  description: "Get recent room transitions for a person. Responds with a transitions list."
  fields:
    entity_name:
      name: Entity Name
      description: Name of the person (e.g., "Alice")
      required: true
      example: Alice
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of transitions to return
      required: false
      default: 20
      example: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1

clear_history:
  name: Clear History
  description: Clear room transition history
  fields:
    entity_name:
      name: Entity Name
      description: Name of the person (clears all if not specified)
      required: false
      example: Alice
      selector:
        text:

get_patterns:
  name: Get Patterns
  description: "Get detected movement patterns for a person. Responds with a patterns list."
  fields:
    entity_name:
      name: Entity Name
      description: Name of the person
      required: true
      example: Alice
      selector:
        text:

cleanup_storage:
  name: Cleanup Storage
  description: Clean up old event log data based on retention policy
  fields:
    retention_days:
      name: Retention Days
      description: Override retention period (days)
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
    max_file_size_mb:
      name: Max File Size (MB)
      description: Override max file size limit
      required: false
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box

identify_person:
  name: Identify Person
  description: Take a camera snapshot and ask the vision model who is in it. Fires a whollm_vision_identification event and can return the result.
  fields:
    camera_entity_id:
      name: Camera
      description: Camera to snapshot
      required: true
      example: camera.living_room
      selector:
        entity:
          domain: camera
    detection_type:
      name: Detection Type
      description: Whether to identify a person or an animal
      required: false
      default: person
      selector:
        select:
          options:
            - person
            - animal

enable_tracking:
  name: Enable Camera Tracking
  description: Turn on the tracking switch for a camera (e.g. Reolink auto-track)
  fields:
    camera_name:
      name: Camera Name
      description: Camera name as used in its switch entity (switch.<camera_name>_auto_tracking)
      required: true
      example: living_room
      selector:
        text:

disable_tracking:
  name: Disable Camera Tracking
  description: Turn off the tracking switch for a camera
  fields:
    camera_name:
      name: Camera Name
      description: Camera name as used in its switch entity (switch.<camera_name>_auto_tracking)
      required: true
      example: living_room
      selector:
        text:
