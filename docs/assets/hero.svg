<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t d">
<title id="t">WhoLLM overview</title>
<desc id="d">Weak signals such as motion, PC state, media players, lights, phone presence and cameras go into WhoLLM, which checks the phone, asks a local LLM and weighs the evidence, then publishes a room and confidence per person.</desc>
