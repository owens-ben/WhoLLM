<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" role="img" aria-labelledby="t d">
<title id="t">Detection pipeline, per poll</title>
<desc id="d">On every poll, for each person and pet: gather context, short-circuit to away if the phone is not home, look up a habit hint, ask the LLM (with a heuristic fallback on error), fuse the evidence into a room and confidence, then publish the sensors, log the event and learn.</desc>
<defs><marker id="arr64748b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrf87171" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrfbbf24" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker></defs>
<rect width="940" height="760" rx="18" fill="#0f172a"/>
<rect x="60" y="22" width="660" height="30" rx="15.0" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
<text x="390.0" y="41.68" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#818cf8" text-anchor="middle">Every poll (default 10 s): step 1 runs once, steps 2–6 run for each person and pet</text>
<rect x="60" y="84" width="420" height="76" rx="14" fill="#16213b" stroke="#2a3a5c" stroke-width="1.5"/>
<circle cx="94" cy="122.0" r="17" fill="#818cf8"/>
<text x="94" y="128.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">1</text>
<text x="126" y="117" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">Gather context</text>
<text x="126" y="139" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Reads only the entities you mapped to rooms or people</text>
<rect x="60" y="196" width="420" height="76" rx="14" fill="#16213b" stroke="#2a3a5c" stroke-width="1.5"/>
<circle cx="94" cy="234.0" r="17" fill="#fbbf24"/>
<text x="94" y="240.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">2</text>
<text x="126" y="229" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">Is the phone away?</text>
<text x="126" y="251" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Persons only · every assigned device_tracker says away</text>
<rect x="60" y="308" width="420" height="76" rx="14" fill="#16213b" stroke="#2a3a5c" stroke-width="1.5"/>
<circle cx="94" cy="346.0" r="17" fill="#34d399"/>
<text x="94" y="352.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">3</text>
<text x="126" y="341" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">Look up the habit hint</text>
<text x="126" y="363" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Learned 2-hour slot suggests a likely room</text>
<rect x="60" y="420" width="420" height="76" rx="14" fill="#16213b" stroke="#2a3a5c" stroke-width="1.5"/>
<circle cx="94" cy="458.0" r="17" fill="#818cf8"/>
<text x="94" y="464.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">4</text>
<text x="126" y="453" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">Ask the LLM</text>
<text x="126" y="475" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Ollama or CrewAI · temperature 0.1 · answers with a room name</text>
<rect x="60" y="532" width="420" height="76" rx="14" fill="#16213b" stroke="#2a3a5c" stroke-width="1.5"/>
<circle cx="94" cy="570.0" r="17" fill="#34d399"/>
<text x="94" y="576.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">5</text>
<text x="126" y="565" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">Fuse the evidence</text>
<text x="126" y="587" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Sensor weights + LLM × 0.5 + habit × 0.35 → best room</text>
<rect x="60" y="644" width="420" height="76" rx="14" fill="#16213b" stroke="#2a3a5c" stroke-width="1.5"/>
<circle cx="94" cy="682.0" r="17" fill="#60a5fa"/>
<text x="94" y="688.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">6</text>
<text x="126" y="677" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">Publish and learn</text>
<text x="126" y="699" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Update sensors · log the event · learn if confidence ≥ 0.7</text>
<line x1="270.0" y1="160" x2="270.0" y2="196" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr64748b)"/>
<line x1="270.0" y1="272" x2="270.0" y2="308" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr64748b)"/>
<line x1="270.0" y1="384" x2="270.0" y2="420" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr64748b)"/>
<line x1="270.0" y1="496" x2="270.0" y2="532" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr64748b)"/>
<line x1="270.0" y1="608" x2="270.0" y2="644" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr64748b)"/>
<line x1="480" y1="234.0" x2="558" y2="234.0" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrfbbf24)"/>
<text x="494" y="226.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start">yes</text>
<text x="282.0" y="296" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">no</text>
<rect x="560" y="204" width="320" height="60" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.5"/>
<text x="576" y="230" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start">Room = away · confidence 0.95</text>
<text x="576" y="250" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Skips the LLM and habit learning; still logged</text>
<path d="M880,234 H906 V682.0 H482" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrfbbf24)"/>
<rect x="560" y="414" width="320" height="88" rx="12" fill="#20142e" stroke="#f87171" stroke-width="1.5"/>
<text x="576" y="438" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start">LLM error or timeout?</text>
<text x="576" y="458" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">A heuristic guess stands in for the answer:</text>
<text x="576" y="476" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">PC on → its room · media playing → living_room</text>
<text x="576" y="492" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">(confidence 0.3 – 0.55), then fused as usual</text>
<line x1="480" y1="456.0" x2="558" y2="456.0" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrf87171)"/>
<rect x="560" y="536" width="320" height="68" rx="12" fill="#111c33" stroke="#2a3a5c" stroke-width="1.5"/>
<text x="576" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="start">confidence = best score ÷ 2.6</text>
<text x="576" y="584" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">2.6 = sum of the three largest default weights</text>
<line x1="480" y1="570.0" x2="558" y2="570.0" stroke="#2a3a5c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="748" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Source: custom_components/whollm/coordinator.py, providers/base.py, habits.py</text>
</svg>
