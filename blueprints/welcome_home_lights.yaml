blueprint:
  name: Roomer - Welcome Home Lights
  description: >-
    Turn on lights when someone arrives home. Triggers when the person's
    Roomer room sensor changes from "away" to a room.
  domain: automation
  author: Roomer
  source_url: https://github.com/owens-ben/Roomer/blob/main/blueprints/welcome_home_lights.yaml
  input:
    person_sensor:
      name: Person Room Sensor
      description: The Roomer room sensor for the person
      selector:
        entity:
          domain: sensor
          integration: roomer
    lights:
      name: Welcome Lights
      description: Lights to turn on when arriving home
      selector:
        target:
          entity:
            domain: light
    brightness:
      name: Brightness
      description: Brightness level (1-100)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    only_after_dark:
      name: Only After Dark
      description: Only turn on lights after sunset
      default: true
      selector:
        boolean:

variables:
  only_after_dark: !input only_after_dark

trigger:
  - platform: state
    entity_id: !input person_sensor
    from: away

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.state not in ['away', 'unknown', 'unavailable'] }}
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ not only_after_dark }}"
      - condition: state
        entity_id: sun.sun
        state: below_horizon

action:
  - service: light.turn_on
    target: !input lights
    data:
      brightness_pct: !input brightness
  - delay:
      minutes: 5
  - service: light.turn_off
    target: !input lights
